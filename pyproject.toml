[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroq"
version = "1.0.0"
description = "Aerospace manufacturing quality data pipeline: ETL, star-schema warehouse, data-quality gates, anomaly detection, FastAPI and dashboard."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "SQLAlchemy>=2.0",
  "scikit-learn>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
dagster = ["dagster>=1.7", "dagster-webserver>=1.7"]
sqlserver = ["pyodbc>=5"]

[project.scripts]
aeroq = "aeroq.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
